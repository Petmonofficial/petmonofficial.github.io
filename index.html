<!DOCTYPE html>
<html lang="tr" data-tema="acik">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F6F4">
<meta name="robots" content="noindex, nofollow">
<title>PETMON · Yazılımlar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231F9C7C'/%3E%3Cstop offset='1' stop-color='%230B4A3B'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cg fill='%23fff'%3E%3Cellipse cx='22' cy='21' rx='5' ry='7'/%3E%3Cellipse cx='42' cy='21' rx='5' ry='7'/%3E%3Cellipse cx='13' cy='34' rx='4.5' ry='6'/%3E%3Cellipse cx='51' cy='34' rx='4.5' ry='6'/%3E%3Cpath d='M32 31c-8 0-15 9-15 15 0 5 4 7 8 6 3-1 5-2 7-2s4 1 7 2c4 1 8-1 8-6 0-6-7-15-15-15z'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* ============================================================
   PETMON · Yazılımlar — görünüm
   Kurumsal renkler: #13705A  #12372F  #0B4A3B
   Yazılım eklemek / link girmek / açık-koyu seçmek için
   sadece en alttaki AYARLAR bölümüne dokun.
   ============================================================ */

/* ---------- AÇIK TEMA: buzlu nane zemin, koyu yeşil yazı ---------- */
[data-tema="acik"]{
  --zemin:#F2F6F4;
  --a1:#9FD6C2; --a1o:.70;
  --a2:#13705A; --a2o:.16;
  --a3:#E6D7B4; --a3o:.55;
  --metin:#12372F; --soluk:#557069; --soluk-2:#93A9A2;
  --kart:linear-gradient(160deg,rgba(255,255,255,.88),rgba(255,255,255,.62));
  --kart-hover:rgba(255,255,255,.96);
  --kenar:rgba(18,55,47,.09);
  --izgara:rgba(18,55,47,.045);
  --golge:0 1px 2px rgba(18,55,47,.05),0 20px 44px -26px rgba(11,74,59,.35);
  --golge-hover:0 0 0 1px rgba(19,112,90,.22),0 0 46px -4px rgba(31,156,124,.55),0 40px 70px -30px rgba(11,74,59,.6);
  --em:linear-gradient(95deg,#0B4A3B 0%,#13705A 30%,#26A383 50%,#13705A 70%,#0B4A3B 100%);
  --vurgu:#13705A;
  --altin:#B4914F;
  --ikon:linear-gradient(150deg,#13705A,#0B4A3B 50%,#0A2C24);
  --ikon-renk:#E6F7F0;
  --hale:#0B4A3B;
  --git-bg:#12372F; --git-renk:#fff;
  --git-hover:linear-gradient(135deg,#13705A,#1F9C7C);
  --pasif-git:rgba(18,55,47,.2);
  --parcacik:#13705A; --parcacik-o:.28;
  --cerceve:#13705A; --cerceve-isik:#3FE0AE;
  --fare:rgba(31,156,124,.30);
}
/* ---------- KOYU TEMA: gece ormanı yeşili ---------- */
[data-tema="koyu"]{
  --zemin:#061712;
  --a1:#13705A; --a1o:.55;
  --a2:#0B4A3B; --a2o:.75;
  --a3:#C9A35A; --a3o:.13;
  --metin:#EEF6F2; --soluk:#9DBAB0; --soluk-2:#62807A;
  --kart:linear-gradient(160deg,rgba(255,255,255,.085),rgba(255,255,255,.025) 65%);
  --kart-hover:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.04) 65%);
  --kenar:rgba(190,240,220,.11);
  --izgara:rgba(190,240,220,.035);
  --golge:0 30px 60px -32px rgba(0,10,6,.95);
  --golge-hover:0 38px 70px -30px rgba(19,112,90,.7);
  --em:linear-gradient(95deg,#7FE0C2 0%,#B9EBD8 30%,#E7CD92 50%,#B9EBD8 70%,#7FE0C2 100%);
  --vurgu:#7FE0C2;
  --altin:#E0C287;
  --ikon:linear-gradient(150deg,#26A383,#13705A 50%,#0B4A3B);
  --ikon-renk:#fff;
  --hale:#1F9C7C;
  --git-bg:#fff; --git-renk:#12372F;
  --git-hover:linear-gradient(135deg,#1F9C7C,#13705A);
  --pasif-git:rgba(190,240,220,.22);
  --parcacik:#9FEBD0; --parcacik-o:.55;
  --cerceve:#1F9C7C; --cerceve-isik:#E7CD92;
  --fare:rgba(31,156,124,.25);
}

/* ---------- Temel ---------- */
@property --aci{syntax:"<angle>";inherits:false;initial-value:0deg}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--metin);background:var(--zemin);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}

/* ---------- Arka plan: hareketli ışıklar ---------- */
.zemin{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
.zemin i{position:absolute;border-radius:50%;filter:blur(100px);animation:suzul 24s ease-in-out infinite alternate}
.zemin i:nth-child(1){width:46vw;height:46vw;min-width:420px;min-height:420px;background:var(--a1);opacity:var(--a1o);top:-20vw;left:-12vw}
.zemin i:nth-child(2){width:40vw;height:40vw;min-width:380px;min-height:380px;background:var(--a2);opacity:var(--a2o);bottom:-22vw;right:-12vw;animation-delay:-8s}
.zemin i:nth-child(3){width:30vw;height:30vw;min-width:300px;min-height:300px;background:var(--a3);opacity:var(--a3o);top:30%;left:50%;animation-delay:-15s}
@keyframes suzul{
  0%{transform:translate(0,0) scale(1)}
  50%{transform:translate(5vw,3vw) scale(1.1)}
  100%{transform:translate(-3vw,6vw) scale(.94)}
}
.zemin::after{
  content:"";position:absolute;inset:0;
  background-image:linear-gradient(var(--izgara) 1px,transparent 1px),linear-gradient(90deg,var(--izgara) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse at 50% 45%,#000 12%,transparent 72%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 12%,transparent 72%);
}
/* yukarı süzülen ışık parçacıkları */
.parcaciklar{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.parcaciklar span{
  position:absolute;bottom:-10px;border-radius:50%;
  background:var(--parcacik);opacity:0;
  box-shadow:0 0 8px var(--parcacik);
  animation:yuksel-parcacik linear infinite;
}
@keyframes yuksel-parcacik{
  0%{transform:translateY(0) translateX(0);opacity:0}
  12%{opacity:var(--parcacik-o)}
  85%{opacity:var(--parcacik-o)}
  100%{transform:translateY(-105vh) translateX(var(--kay,20px));opacity:0}
}

/* ---------- Yerleşim ---------- */
.sayfa{
  min-height:100vh;min-height:100dvh;
  max-width:1180px;margin:0 auto;
  padding:clamp(18px,3.2vh,34px) 24px clamp(16px,2.6vh,26px);
  display:flex;flex-direction:column;
}
header{display:flex;align-items:center;justify-content:space-between;gap:16px}
.marka{display:flex;align-items:center;gap:11px}
.marka-ikon{
  width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
  background:var(--ikon);
  box-shadow:0 10px 24px -10px var(--hale), inset 0 1px 0 rgba(255,255,255,.3);
}
.marka-ikon svg{width:23px;height:23px}
.marka b{display:block;font-size:16px;font-weight:800;letter-spacing:.18em}
.marka small{display:block;font-size:10.5px;color:var(--soluk-2);letter-spacing:.16em;margin-top:2px}
.saat{display:flex;align-items:baseline;gap:10px;color:var(--soluk);font-size:13px}
.saat b{color:var(--metin);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}

.ust{
  text-align:center;
  margin:auto auto clamp(22px,4.8vh,46px);padding-top:clamp(16px,3vh,30px);
  animation:yuksel .8s cubic-bezier(.2,.8,.2,1) both;
}
.selam{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12.5px;font-weight:700;color:var(--vurgu);
  padding:6px 14px;border-radius:999px;
  background:color-mix(in srgb,var(--vurgu) 9%,transparent);
  border:1px solid color-mix(in srgb,var(--vurgu) 28%,transparent);
  margin-bottom:clamp(10px,2vh,18px);
}
.selam i{width:6px;height:6px;border-radius:50%;background:var(--vurgu);box-shadow:0 0 10px var(--vurgu);animation:nabiz 2.2s infinite}
@keyframes nabiz{50%{opacity:.3}}
h1{font-size:clamp(28px,4.4vw,48px);line-height:1.08;font-weight:800;letter-spacing:-.03em}
h1 em{
  font-style:normal;background:var(--em);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:akis 7s ease-in-out infinite;
}
@keyframes akis{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
.ust p{color:var(--soluk);font-size:15px;margin-top:10px}

/* ---------- Kart ızgarası (adet sayısına göre JS ayarlar) ---------- */
.izgara{
  --gap:20px;
  display:flex;flex-wrap:wrap;justify-content:center;gap:var(--gap);
  width:100%;max-width:var(--genislik,100%);margin:0 auto auto;
}
.izgara>.kart{flex:0 0 calc((100% - (var(--kolon,3) - 1) * var(--gap)) / var(--kolon,3));min-width:0}

.kart{
  position:relative;display:flex;flex-direction:column;
  padding:26px 24px 22px;border-radius:24px;
  background:var(--kart);
  border:1px solid var(--kenar);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  box-shadow:var(--golge);
  text-decoration:none;color:inherit;isolation:isolate;cursor:pointer;
  transition:transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s;
  animation:yuksel .75s cubic-bezier(.2,.8,.2,1) both;
}
/* dönen yeşil çerçeve ışığı */
.kart::after{
  content:"";position:absolute;inset:-1px;border-radius:inherit;padding:2px;pointer-events:none;
  background:conic-gradient(from var(--aci),transparent 0 40%,var(--cerceve) 66%,var(--cerceve-isik) 78%,#fff 80%,var(--cerceve-isik) 82%,var(--cerceve) 92%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  opacity:0;transition:opacity .45s;animation:don 3.2s linear infinite;
  filter:drop-shadow(0 0 6px var(--cerceve-isik));
}
@keyframes don{to{--aci:360deg}}
/* fareyi takip eden ışık */
.kart::before{
  content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;opacity:0;transition:opacity .4s;
  background:radial-gradient(440px circle at var(--mx,50%) var(--my,0%),var(--fare),transparent 62%);
}
.kart:hover{transform:translateY(-9px);box-shadow:var(--golge-hover);background:var(--kart-hover)}
.kart:hover::after,.kart:hover::before{opacity:1}

.kart-ust{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.ikon{
  position:relative;width:58px;height:58px;border-radius:18px;flex:none;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.22),transparent 55%),var(--ikon);
  box-shadow:0 14px 30px -12px var(--hale), inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .45s cubic-bezier(.2,.8,.2,1);
  animation:yuzer 5s ease-in-out infinite;
}
.kart:nth-child(2n) .ikon{animation-delay:-1.6s}
.kart:nth-child(3n) .ikon{animation-delay:-3.2s}
@keyframes yuzer{0%,100%{translate:0 0}50%{translate:0 -4px}}
.ikon::after{ /* arkadaki hale */
  content:"";position:absolute;inset:-10px;border-radius:24px;z-index:-1;
  background:var(--hale);filter:blur(20px);opacity:.28;
  animation:nabiz 3.5s ease-in-out infinite;
}
.kart:hover .ikon{transform:scale(1.09) rotate(-5deg);box-shadow:0 18px 36px -10px #1F9C7C, inset 0 1px 0 rgba(255,255,255,.35)}
.kart:hover .ikon::after{opacity:.65;filter:blur(24px);animation:none;background:#1F9C7C}
.ikon svg{width:27px;height:27px;color:var(--ikon-renk)}
.ikon b{font-size:23px;font-weight:800;color:var(--ikon-renk)}
.no{font-size:12.5px;font-weight:800;letter-spacing:.12em;color:var(--altin);font-variant-numeric:tabular-nums}

.govde{flex:1;min-width:0}
.kart h3{font-size:19px;font-weight:700;letter-spacing:-.015em;margin-bottom:8px}
.kart p{color:var(--soluk);font-size:14px;line-height:1.6}
.mok{display:none}

.kart-alt{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:22px;padding-top:16px;border-top:1px solid var(--kenar);
}
.durum{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--soluk)}
.durum i{width:7px;height:7px;border-radius:50%;background:#2FC48F;box-shadow:0 0 0 3px rgba(47,196,143,.18);animation:nabiz 2.4s infinite}
.git{
  display:inline-flex;align-items:center;gap:7px;
  font-size:14px;font-weight:700;color:var(--git-renk);
  padding:10px 17px;border-radius:12px;background:var(--git-bg);
  transition:gap .25s,background .3s,color .3s;
}
.git svg{width:16px;height:16px;transition:transform .25s}
.kart:hover .git{gap:10px;background:var(--git-hover);color:#fff}
.kart:hover .git svg{transform:translate(2px,-2px)}

/* link girilmemiş kart */
.kart.pasif .durum i{background:var(--altin);box-shadow:0 0 0 3px color-mix(in srgb,var(--altin) 20%,transparent)}
.kart.pasif .git{background:transparent;color:var(--soluk);border:1px dashed var(--pasif-git)}
.kart.pasif:hover .git{background:color-mix(in srgb,var(--vurgu) 8%,transparent);color:var(--vurgu);border-color:color-mix(in srgb,var(--vurgu) 40%,transparent);gap:7px}

/* ---------- 4'ten fazla yazılım: iki sıra, kartlar biraz küçülür ---------- */
.yogun .ust{margin-bottom:clamp(16px,3vh,30px)}
.yogun .izgara{--gap:16px}
.yogun .kart{padding:20px 20px 16px;border-radius:20px}
.yogun .kart-ust{margin-bottom:14px}
.yogun .ikon{width:46px;height:46px;border-radius:14px}
.yogun .ikon svg{width:22px;height:22px}
.yogun .kart h3{font-size:17px;margin-bottom:5px}
.yogun .kart p{font-size:13px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.yogun .kart-alt{margin-top:14px;padding-top:12px}
.yogun .git{padding:8px 14px;font-size:13px}

footer{
  margin-top:clamp(18px,3.5vh,34px);
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  color:var(--soluk-2);font-size:12.5px;
}

@keyframes yuksel{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ---------- Tablet ---------- */
@media (max-width:900px){
  .izgara{--kolon:2 !important;--genislik:100% !important}
}
/* ---------- Telefon: yatay, kompakt satırlar ---------- */
@media (max-width:640px){
  .sayfa{padding:18px 16px 16px}
  .saat small{display:none}
  .ust,.yogun .ust{text-align:left;margin:auto 0 22px}
  .ust p{font-size:14px}
  .izgara,.yogun .izgara{--kolon:1 !important;--gap:10px}
  .kart,.yogun .kart{flex-direction:row;align-items:center;gap:14px;padding:14px;border-radius:18px}
  .kart:hover{transform:none}
  .kart:active{transform:scale(.98)}
  .kart-ust,.yogun .kart-ust{margin:0}
  .kart-ust .no,.kart-alt{display:none}
  .ikon,.yogun .ikon{width:46px;height:46px;border-radius:14px}
  .ikon svg{width:22px;height:22px}
  .kart h3,.yogun .kart h3{font-size:16px;margin-bottom:2px}
  .kart p,.yogun .kart p{font-size:12.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .mok{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:11px;background:var(--git-bg);color:var(--git-renk)}
  .mok svg{width:16px;height:16px}
  .kart.pasif .mok{background:transparent;border:1px dashed var(--pasif-git);color:var(--soluk-2)}
  footer{font-size:11.5px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div class="zemin"><i></i><i></i><i></i></div>
<div class="parcaciklar" id="parcaciklar"></div>

<div class="sayfa" id="sayfa">
  <header>
    <div class="marka">
      <div class="marka-ikon">
        <svg viewBox="0 0 64 64" fill="#fff"><ellipse cx="22" cy="20" rx="5.5" ry="7.5"/><ellipse cx="42" cy="20" rx="5.5" ry="7.5"/><ellipse cx="11" cy="34" rx="5" ry="6.5"/><ellipse cx="53" cy="34" rx="5" ry="6.5"/><path d="M32 30c-9 0-16 10-16 16.5 0 5 4.5 7.5 9 6.3 3-.8 4.7-1.8 7-1.8s4 1 7 1.8c4.5 1.2 9-1.3 9-6.3C48 40 41 30 32 30z"/></svg>
      </div>
      <div><b>PETMON</b><small>YAZILIMLAR</small></div>
    </div>
    <div class="saat"><small id="tarih"></small><b id="saat">--:--</b></div>
  </header>

  <section class="ust">
    <div class="selam"><i></i><span id="selam">Hoş geldiniz</span></div>
    <h1>Şirket yazılımları <em>tek ekranda.</em></h1>
    <p>Kullanmak istediğiniz yazılıma tıklayın, yeni sekmede açılır.</p>
  </section>

  <main class="izgara" id="liste"></main>

  <footer>
    <span>© <span id="yil"></span> PETMON · Şirket içi kullanım</span>
    <span id="sayi"></span>
  </footer>
</div>

<script>
/* ==================================================================
   ✏️  AYARLAR — SADECE BURAYI DÜZENLE
   ------------------------------------------------------------------
   TEMA : "acik"  → açık nane zemin, koyu yeşil yazılar
          "koyu"  → gece yeşili zemin, açık yazılar
   ================================================================== */
const TEMA = "acik";

/* ------------------------------------------------------------------
   YAZILIMLAR
   Her yazılım bir { ... }, bloğu. Yeni yazılım eklemek için son
   bloğu kopyala, altına yapıştır, ad / açıklama / link'i değiştir.

   ad       : kartta görünen isim
   aciklama : kısa açıklama (1-2 cümle)
   link     : tam adres. Boş kalırsa kart "Hazırlanıyor" olarak
              soluk görünür ve tıklanamaz. https:// yazmasan da olur.
   ikon     : (isteğe bağlı) personel | stok | indir | grafik |
              belge | sepet | ayar | takvim | gorsel
              Yazmazsan ismin ilk harfi ikon olur.

   Düzen kart sayısına göre kendiliğinden ayarlanır:
   1-4 yazılım tek sıra, 5-8 yazılım iki sıra.
   ------------------------------------------------------------------ */
const YAZILIMLAR = [
  {
    ad:       "Personel Yönetim",
    aciklama: "Mağaza konumlu giriş-çıkış, mesai ve izin takibi, aylık çalışma raporları.",
    link:     "https://petmon-personel.netlify.app/yonetim",
    ikon:     "personel"
  },
  {
    ad:       "Hareketsiz Stok",
    aciklama: "Raflarda 2 hafta, 30 gün ve 6 aydır hareket görmeyen ürünler; marka filtresi ve güncelleme.",
    link:     "",
    ikon:     "stok"
  },
  {
    ad:       "Monge Kaynaklar",
    aciklama: "Monge ve Gemon ürünlerinin besin değeri görselleri ve görsel paketleri, indirmeye hazır.",
    link:     "https://petmonofficial.github.io/monge-kaynaklar/",
    ikon:     "indir"
  },
  {
    ad:       "Monge Türkiye",
    aciklama: "Monge Türkiye web sitesi; yapım aşamasında, yakında yayında.",
    link:     "",
    ikon:     ""
  },
  {
    ad:       "Görsel Düzenleyici",
    aciklama: "Ürün görsellerini kırpar, büyütür ve aynı ölçüde hizalar; toplu ZIP indirme.",
    link:     "https://petmonofficial.github.io/gorsel-duzenleyici.html",
    ikon:     "gorsel"
  },
];
/* ================================================================== */

document.documentElement.dataset.tema = TEMA === "koyu" ? "koyu" : "acik";
document.querySelector('meta[name="theme-color"]').content = TEMA === "koyu" ? "#061712" : "#F2F6F4";

const IKON = {
  personel:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M17 11.5l1.6 1.6L22 9.7"/>',
  stok:    '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
  indir:   '<path d="M12 4v11m0 0-4-4m4 4 4-4"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/>',
  grafik:  '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  belge:   '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
  sepet:   '<path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/>',
  ayar:    '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  takvim:  '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  gorsel:  '<rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>'
};
const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function temizLink(l){
  l = String(l || '').trim();
  if (!l) return '';
  if (!/^https?:\/\//i.test(l)) l = 'https://' + l;
  return l;
}

/* --- kartlar ve düzen --- */
const liste = YAZILIMLAR.filter(y => y && y.ad);
const n = liste.length;
const kolon = n <= 4 ? Math.max(n, 1) : (n <= 6 ? 3 : 4);
const izgara = document.getElementById('liste');
izgara.style.setProperty('--kolon', kolon);
if (n === 1) izgara.style.setProperty('--genislik', '380px');
if (n === 2) izgara.style.setProperty('--genislik', '780px');
if (n > 4) document.getElementById('sayfa').classList.add('yogun');

izgara.innerHTML = liste.map((y, i) => {
  const link = temizLink(y.link);
  const tag = link ? 'a' : 'div';
  const href = link ? ` href="${esc(link)}" target="_blank" rel="noopener noreferrer"` : '';
  const ikon = IKON[y.ikon] ? svg(IKON[y.ikon]) : `<b>${esc(y.ad.trim().charAt(0).toLocaleUpperCase('tr'))}</b>`;
  return `
  <${tag} class="kart ${link ? '' : 'pasif'}"${href} style="animation-delay:${.12 + i * .07}s">
    <div class="kart-ust">
      <div class="ikon">${ikon}</div>
      <span class="no">${String(i + 1).padStart(2, '0')}</span>
    </div>
    <div class="govde">
      <h3>${esc(y.ad)}</h3>
      <p>${esc(y.aciklama)}</p>
    </div>
    <span class="mok">${link ? OK : '…'}</span>
    <div class="kart-alt">
      <span class="durum"><i></i>${link ? 'Çalışıyor' : 'Hazırlanıyor'}</span>
      <span class="git">${link ? 'Aç ' + OK : 'Yakında'}</span>
    </div>
  </${tag}>`;
}).join('');

document.querySelectorAll('.kart').forEach(k => k.addEventListener('pointermove', e => {
  const r = k.getBoundingClientRect();
  k.style.setProperty('--mx', (e.clientX - r.left) + 'px');
  k.style.setProperty('--my', (e.clientY - r.top) + 'px');
}));

/* --- yükselen parçacıklar --- */
const pk = document.getElementById('parcaciklar');
const adet = window.innerWidth < 640 ? 12 : 22;
for (let i = 0; i < adet; i++){
  const s = document.createElement('span');
  const boy = 2 + Math.random() * 3;
  s.style.cssText = `left:${Math.random()*100}%;width:${boy}px;height:${boy}px;` +
    `animation-duration:${14 + Math.random()*16}s;animation-delay:${-Math.random()*30}s;` +
    `--kay:${(Math.random()*80 - 40).toFixed(0)}px`;
  pk.appendChild(s);
}

/* --- saat ve selam --- */
function saat(){
  const d = new Date();
  document.getElementById('saat').textContent = d.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
  document.getElementById('tarih').textContent = d.toLocaleDateString('tr-TR', {weekday:'long', day:'numeric', month:'long'});
  const h = d.getHours();
  document.getElementById('selam').textContent = h < 6 ? 'İyi geceler' : h < 12 ? 'Günaydın' : h < 18 ? 'İyi günler' : 'İyi akşamlar';
}
saat(); setInterval(saat, 30000);
document.getElementById('yil').textContent = new Date().getFullYear();
document.getElementById('sayi').textContent = n + ' yazılım';
</script>
</body>
</html>
